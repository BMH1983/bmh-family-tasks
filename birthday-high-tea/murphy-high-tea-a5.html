.bloom.b { width:56mm; height:50mm; background:#E7D6F3; bottom:-12mm; left:-14mm; }

.inner { position:relative; z-index:2; width:100%; height:100%;

.hightea {

  letter-spacing:.10em; text-transform:uppercase;
}
.party {

  font-size:18mm; line-height:1;

.side {
  position:absolute; top:30mm; width:34mm; text-align:center;
  font-size:3.5mm; line-height:1.9; letter-spacing:.16em;

}
.side.left  { left:-1mm; }
.side.right { right:-1mm; }
.side .big { font-size:4.6mm; letter-spacing:.10em; }

.treat { position:absolute; width:18mm; }
.treat.cupcake { left:7mm;  top:8mm;  transform:rotate(-7deg); }
.treat.cookie  { right:7mm; top:9mm;  transform:rotate(9deg); }

.girl { width:68mm; margin-top:0; }

/* ---------- details ---------- */
.details { width:100%; text-align:center; margin-top:auto; }

.dateline {
  display:flex; align-items:center; justify-content:center; gap:3.5mm;
  font-size:5.4mm; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
}
.dateline .num { font-family:'Parisienne',cursive; color:var(--grape);

@media print {

  @page { size:148mm 210mm; margin:0; }
